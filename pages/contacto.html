<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacta a Sharon Araya por correo, LinkedIn o GitHub.">
    <title>Contacto | Sharon Araya</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/contacto.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="site-frame">
        <div data-header-mount></div>

        <main class="contact-main">
            <div class="contact-grid" aria-hidden="true"></div>

            <div class="contact-content">
                <section class="contact-info" aria-labelledby="contact-title">
                    <p class="eyebrow">CONTACTO</p>
                    <h1 id="contact-title">Hablemos</h1>
                    <p class="contact-intro">¿Tienes un proyecto o una oportunidad en la que podamos trabajar? ¡Me encantaría saber de ti!</p>

                    <ul class="contact-list">
                        <li>
                            <span class="contact-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
                            </span>
                            <span><strong>Correo</strong><a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=sharonaraya19%40gmail.com" target="_blank" rel="noopener noreferrer">sharonaraya19@gmail.com</a></span>
                        </li>
                        <li>
                            <span class="contact-icon social-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.2.8-.6v-2.1c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.6 11.6 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.3.8 1 .8 2v3.4c0 .4.2.7.8.6A11.1 11.1 0 0 0 12 .9Z"/></svg>
                            </span>
                            <span><strong>GitHub</strong><a href="https://github.com/Shary09" target="_blank" rel="noopener noreferrer">github.com/Shary09</a></span>
                        </li>
                        <li>
                            <span class="contact-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24"><path d="M4 3h16v18H4z"/><path d="M8 9v7M8 6.8v.1M12 16v-7h3v1c.5-.8 1.3-1.2 2.3-1.2 2 0 2.7 1.3 2.7 3.4V16M12 12c0-1.8 1.1-3.2 3-3.2"/></svg>
                            </span>
                            <span><strong>LinkedIn</strong><a href="https://www.linkedin.com/in/sharon-araya-ram%C3%ADrez-8a5351147" target="_blank" rel="noopener noreferrer">linkedin.com/in/sharon-araya-ramírez-8a5351147</a></span>
                        </li>
                        <li>
                            <span class="contact-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
                            </span>
                            <span><strong>Ubicación</strong><span class="contact-value">Costa Rica</span></span>
                        </li>
                    </ul>
                </section>

                <section class="contact-form-wrap" aria-label="Formulario de contacto">
                    <form class="contact-form">
                        <label class="visually-hidden" for="contact-name">Nombre</label>
                        <input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Nombre" required>

                        <label class="visually-hidden" for="contact-email">Correo electrónico</label>
                        <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="Correo electrónico" required>

                        <label class="visually-hidden" for="contact-message">Mensaje</label>
                        <textarea id="contact-message" name="message" placeholder="Mensaje" rows="4" required></textarea>

                        <button type="submit">Enviar mensaje <span aria-hidden="true">&rarr;</span></button>
                        <p class="form-status" role="status" aria-live="polite"></p>
                    </form>
                    <p class="thanks">Gracias por visitar mi portafolio <span aria-hidden="true">&#9829;</span></p>
                </section>
            </div>
        </main>
    </div>

    <script src="../js/header-loader.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
